
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "blackbar-mcp"
version = "0.8.1"
description = "BlackBar MCP - Media Redaction on Databricks"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastmcp>=2.0,<3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "databricks-sdk>=0.40",
    "openai>=1.60,<3",
    "pillow>=11",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10",
    "faster-whisper>=1.1",
    "imageio-ffmpeg>=0.6,<1",
    "pymupdf>=1.24",
    "pydantic>=2",
]

[project.scripts]
blackbar-mcp = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]
